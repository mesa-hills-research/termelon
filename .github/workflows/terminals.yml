name: Terminals

# Runs the harness in real terminals. Each starts with the probe, shows its scenes, and is read back
# and compared with termelon-vt. tmux, xterm.js and a kitty smoke test run on every push to main, and
# the rest nightly, on demand, and on pull requests labelled `terminals`.

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: terminals-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

# Actions are pinned to commits of releases published at least 30 days before they were chosen.
# Each job starts non-blocking (continue-on-error) and becomes required after two weeks of green
# nightly runs.

jobs:
  tmux:
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'terminals')
    continue-on-error: true
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # Ubuntu 24.04 has tmux 3.4, 26.04 has 3.6a, and Homebrew has 3.8.
        os: [ubuntu-24.04, ubuntu-26.04, macos-26]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # 2026-10-09
        with:
          toolchain: "1.99.0"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Install tmux
        run: |
          if [ "$RUNNER_OS" = macOS ]; then brew install tmux; else sudo apt-get update && sudo apt-get install -y tmux; fi
      - run: cargo build -p harness -p probe --locked
      - run: target/debug/harness version tmux
      - run: cargo test -p harness --locked --test tmux --test samples
      - run: target/debug/harness smoke tmux
      - run: target/debug/harness run tmux --probe target/debug/probe --out harness-out
      - if: always()
        run: target/debug/harness keys tmux --probe target/debug/probe --out harness-out
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tmux-${{ matrix.os }}
          path: harness-out
          if-no-files-found: ignore

  screen:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'terminals')
    continue-on-error: true
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # Ubuntu has screen 4.9.1, and Homebrew has 5.0.2. The driver runs screen in a tmux pane and
        # presses keys with tmux, so Linux takes 26.04's tmux 3.6, since 3.4 drops Ctrl+Enter and
        # Ctrl+1 and types Shift+Enter's name.
        os: [ubuntu-26.04, macos-26]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # 2026-10-09
        with:
          toolchain: "1.99.0"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Install screen and tmux
        run: |
          if [ "$RUNNER_OS" = macOS ]; then brew install screen tmux; else sudo apt-get update && sudo apt-get install -y screen tmux; fi
      - run: cargo build -p harness -p probe --locked
      - run: target/debug/harness version screen
      - run: cargo test -p harness --locked --test screen
      - run: target/debug/harness smoke screen
      - run: target/debug/harness run screen --probe target/debug/probe --out harness-out
      - if: always()
        run: target/debug/harness keys screen --probe target/debug/probe --out harness-out
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: screen-${{ matrix.os }}
          path: harness-out
          if-no-files-found: ignore

  kitty:
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'terminals')
    continue-on-error: true
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # Ubuntu 24.04 has kitty 0.32.2, and 26.04 has 0.45.0.
        os: [ubuntu-24.04, ubuntu-26.04]
    runs-on: ${{ matrix.os }}
    env:
      DISPLAY: ":99"
      LIBGL_ALWAYS_SOFTWARE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # 2026-10-09
        with:
          toolchain: "1.99.0"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Install kitty and a display
        run: sudo apt-get update && sudo apt-get install -y kitty xvfb x11-utils xdotool imagemagick
      - name: Start Xvfb
        run: |
          Xvfb :99 -screen 0 1280x800x24 -dpi 96 -nolisten tcp &
          for _ in $(seq 100); do xdpyinfo >/dev/null 2>&1 && break; sleep 0.1; done
          xdpyinfo | head -n 5
      - run: cargo build -p harness -p probe --locked
      - run: target/debug/harness version kitty
      - run: target/debug/harness smoke kitty
      # On a push only the smoke test runs, and the scenes and keys run nightly.
      - if: github.event_name != 'push'
        run: target/debug/harness run kitty --probe target/debug/probe --out harness-out
      - if: always() && github.event_name != 'push'
        run: target/debug/harness keys kitty --probe target/debug/probe --out harness-out
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kitty-${{ matrix.os }}
          path: harness-out
          if-no-files-found: ignore

  xterm:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'terminals')
    continue-on-error: true
    timeout-minutes: 20
    runs-on: ubuntu-24.04
    env:
      DISPLAY: ":99"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # 2026-10-09
        with:
          toolchain: "1.99.0"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # xfonts-base has the 9x15 bitmap font the driver asks for.
      - name: Install xterm and a display
        run: sudo apt-get update && sudo apt-get install -y xterm xfonts-base xvfb x11-utils xdotool imagemagick
      - name: Start Xvfb
        run: |
          Xvfb :99 -screen 0 1280x800x24 -dpi 96 -nolisten tcp &
          for _ in $(seq 100); do xdpyinfo >/dev/null 2>&1 && break; sleep 0.1; done
          xdpyinfo | head -n 5
      - run: cargo build -p harness -p probe --locked
      - run: target/debug/harness version xterm
      - run: target/debug/harness smoke xterm
      - run: target/debug/harness run xterm --probe target/debug/probe --out harness-out
      - if: always()
        run: target/debug/harness keys xterm --probe target/debug/probe --out harness-out
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: xterm-ubuntu-24.04
          path: harness-out
          if-no-files-found: ignore

  wezterm:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'terminals')
    continue-on-error: true
    timeout-minutes: 20
    runs-on: ubuntu-24.04
    env:
      DISPLAY: ":99"
      LIBGL_ALWAYS_SOFTWARE: "1"
      # WezTerm isn't in Ubuntu's archive. This is its newest release, from 2024-02-03, checked
      # against this SHA-256 before it's installed.
      WEZTERM_DEB: https://github.com/wezterm/wezterm/releases/download/20240203-110809-5046fc22/wezterm-20240203-110809-5046fc22.Ubuntu22.04.deb
      WEZTERM_SHA256: 86358dab5794a4fb63f7c91dd68d4fdc3da58faad648a58fc77d2bd51c7b0686
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # 2026-10-09
        with:
          toolchain: "1.99.0"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Install WezTerm and a display
        run: |
          curl -fsSL -o "$RUNNER_TEMP/wezterm.deb" "$WEZTERM_DEB"
          echo "$WEZTERM_SHA256  $RUNNER_TEMP/wezterm.deb" | sha256sum -c -
          sudo apt-get update
          # WezTerm opens its window through EGL, even with the software renderer.
          sudo apt-get install -y "$RUNNER_TEMP/wezterm.deb" libegl1 libegl-mesa0 xvfb x11-utils xdotool imagemagick
      - name: Start Xvfb
        run: |
          Xvfb :99 -screen 0 1280x800x24 -dpi 96 -nolisten tcp &
          for _ in $(seq 100); do xdpyinfo >/dev/null 2>&1 && break; sleep 0.1; done
          xdpyinfo | head -n 5
      - run: cargo build -p harness -p probe --locked
      - run: target/debug/harness version wezterm
      - run: target/debug/harness smoke wezterm
      - run: target/debug/harness run wezterm --probe target/debug/probe --out harness-out
      - if: always()
        run: target/debug/harness keys wezterm --probe target/debug/probe --out harness-out
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wezterm-ubuntu-24.04
          path: harness-out
          if-no-files-found: ignore

  xtermjs:
    # xterm.js is the terminal of VS Code and most web terminals, so it runs on every push.
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'terminals')
    continue-on-error: true
    timeout-minutes: 20
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # 2026-10-09
        with:
          toolchain: "1.99.0"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # Node comes with the runner image. The lock file pins @xterm/headless and node-pty with
      # their hashes, and node-pty builds with the image's compiler.
      - run: npm ci --no-audit --no-fund
        working-directory: tools/harness/xtermjs
      - run: cargo build -p harness -p probe --locked
      - run: target/debug/harness version xtermjs
      - run: cargo test -p harness --locked --test live
      - run: target/debug/harness smoke xtermjs
      - run: target/debug/harness run xtermjs --probe target/debug/probe --out harness-out
      - if: always()
        run: target/debug/harness keys xtermjs --probe target/debug/probe --out harness-out
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: xtermjs-ubuntu-24.04
          path: harness-out
          if-no-files-found: ignore

  alacritty:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'terminals')
    continue-on-error: true
    timeout-minutes: 20
    # Ubuntu 24.04 has Alacritty 0.13.2.
    runs-on: ubuntu-24.04
    env:
      DISPLAY: ":99"
      LIBGL_ALWAYS_SOFTWARE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # 2026-10-09
        with:
          toolchain: "1.99.0"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # Alacritty loads libxkbcommon-x11 at run time, and its package doesn't pull it in.
      - name: Install Alacritty and a display
        run: sudo apt-get update && sudo apt-get install -y alacritty libxkbcommon-x11-0 xvfb x11-utils xdotool imagemagick
      - name: Start Xvfb
        run: |
          Xvfb :99 -screen 0 1280x800x24 -dpi 96 -nolisten tcp &
          for _ in $(seq 100); do xdpyinfo >/dev/null 2>&1 && break; sleep 0.1; done
          xdpyinfo | head -n 5
      - run: cargo build -p harness -p probe --locked
      - run: target/debug/harness version alacritty
      - run: target/debug/harness smoke alacritty
      - run: target/debug/harness run alacritty --probe target/debug/probe --out harness-out
      - if: always()
        run: target/debug/harness keys alacritty --probe target/debug/probe --out harness-out
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: alacritty-ubuntu-24.04
          path: harness-out
          if-no-files-found: ignore

  vte:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'terminals')
    continue-on-error: true
    timeout-minutes: 20
    # Ubuntu 24.04 has VTE 0.76, the first with get_text_format.
    runs-on: ubuntu-24.04
    env:
      DISPLAY: ":99"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # 2026-10-09
        with:
          toolchain: "1.99.0"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Install VTE and a display
        run: sudo apt-get update && sudo apt-get install -y python3-gi gir1.2-gtk-3.0 gir1.2-vte-2.91 xvfb x11-utils imagemagick
      - name: Start Xvfb
        run: |
          Xvfb :99 -screen 0 1280x800x24 -dpi 96 -nolisten tcp &
          for _ in $(seq 100); do xdpyinfo >/dev/null 2>&1 && break; sleep 0.1; done
          xdpyinfo | head -n 5
      - run: cargo build -p harness -p probe --locked
      - run: target/debug/harness version vte
      - run: cargo test -p harness --locked --test live
      - run: target/debug/harness smoke vte
      - run: target/debug/harness run vte --probe target/debug/probe --out harness-out
      - if: always()
        run: target/debug/harness keys vte --probe target/debug/probe --out harness-out
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vte-ubuntu-24.04
          path: harness-out
          if-no-files-found: ignore

  konsole:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'terminals')
    continue-on-error: true
    timeout-minutes: 30
    # Ubuntu 26.04 has Konsole 25.12.3. 24.04's 23.08 has no way to read its screen.
    runs-on: ubuntu-26.04
    env:
      DISPLAY: ":99"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # 2026-10-09
        with:
          toolchain: "1.99.0"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Install Konsole and a display
        run: sudo apt-get update && sudo apt-get install -y konsole dbus-x11 libglib2.0-bin xvfb x11-utils xdotool imagemagick
      - name: Start Xvfb
        run: |
          Xvfb :99 -screen 0 1280x800x24 -dpi 96 -nolisten tcp &
          for _ in $(seq 100); do xdpyinfo >/dev/null 2>&1 && break; sleep 0.1; done
          xdpyinfo | head -n 5
      - run: cargo build -p harness -p probe --locked
      - run: target/debug/harness version konsole
      # Konsole and gdbus need a session bus.
      - run: dbus-run-session -- sh -c 'target/debug/harness smoke konsole && target/debug/harness run konsole --probe target/debug/probe --out harness-out'
      - if: always()
        run: dbus-run-session -- target/debug/harness keys konsole --probe target/debug/probe --out harness-out
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: konsole-ubuntu-26.04
          path: harness-out
          if-no-files-found: ignore

  foot:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'terminals')
    continue-on-error: true
    timeout-minutes: 20
    # Ubuntu 26.04 has foot 1.25.0. It runs under headless sway, drawn in software.
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # 2026-10-09
        with:
          toolchain: "1.99.0"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Install foot and sway
        run: sudo apt-get update && sudo apt-get install -y foot sway wtype
      # Windows float, so foot keeps the size it asks for rather than filling the output.
      - name: Start headless sway
        run: |
          export XDG_RUNTIME_DIR="${XDG_RUNTIME_DIR:-/run/user/$(id -u)}"
          echo 'for_window [app_id=".*"] floating enable' > "$RUNNER_TEMP/sway.conf"
          WLR_BACKENDS=headless WLR_LIBINPUT_NO_DEVICES=1 WLR_RENDERER=pixman sway -c "$RUNNER_TEMP/sway.conf" > "$RUNNER_TEMP/sway.log" 2>&1 &
          for _ in $(seq 100); do ls "$XDG_RUNTIME_DIR"/wayland-? >/dev/null 2>&1 && break; sleep 0.1; done
          socket="$(basename "$(ls "$XDG_RUNTIME_DIR"/wayland-? | head -n 1)")"
          echo "XDG_RUNTIME_DIR=$XDG_RUNTIME_DIR" >> "$GITHUB_ENV"
          echo "WAYLAND_DISPLAY=$socket" >> "$GITHUB_ENV"
      - run: cargo build -p harness -p probe --locked
      - run: target/debug/harness version foot
      - run: target/debug/harness smoke foot
      # wtype's keys aren't a keyboard's: its keymap has one level per key, so Shift with a letter
      # doesn't reach foot as a keyboard sends it, and the first key after a new keymap can be
      # lost. foot's keys aren't checked.
      - run: target/debug/harness run foot --probe target/debug/probe --out harness-out
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: foot-ubuntu-26.04
          path: harness-out
          if-no-files-found: ignore

  ghostty:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'terminals')
    continue-on-error: true
    timeout-minutes: 20
    runs-on: macos-26
    env:
      # Ghostty 1.3.1, from 2026-03-13, checked against this SHA-256 before it's installed.
      GHOSTTY_DMG: https://release.files.ghostty.org/1.3.1/Ghostty.dmg
      GHOSTTY_SHA256: 18cff2b0a6cee90eead9c7d3064e808a252a40baf214aa752c1ecb793b8f5f69
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # 2026-10-09
        with:
          toolchain: "1.99.0"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Install Ghostty
        run: |
          curl -fsSL -o "$RUNNER_TEMP/Ghostty.dmg" "$GHOSTTY_DMG"
          echo "$GHOSTTY_SHA256  $RUNNER_TEMP/Ghostty.dmg" | shasum -a 256 -c -
          hdiutil attach -nobrowse -mountpoint "$RUNNER_TEMP/ghostty" "$RUNNER_TEMP/Ghostty.dmg"
          cp -R "$RUNNER_TEMP/ghostty/Ghostty.app" /Applications/
          hdiutil detach "$RUNNER_TEMP/ghostty"
          xattr -cr /Applications/Ghostty.app
      - run: cargo build -p harness -p probe --locked
      - run: target/debug/harness version ghostty
      - run: target/debug/harness smoke ghostty
      # System Events types a non-ASCII character as another key, and macOS keeps Ctrl+Left and
      # Ctrl+F5 for itself, so Ghostty's keys aren't checked.
      - run: target/debug/harness run ghostty --probe target/debug/probe --out harness-out
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ghostty-macos-26
          path: harness-out
          if-no-files-found: ignore

  windows-terminal:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'terminals')
    continue-on-error: true
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Server 2025 has Windows Terminal 1.23. Server 2022 has none, so it gets the portable
        # build of 1.25.
        os: [windows-2025, windows-2022]
    runs-on: ${{ matrix.os }}
    env:
      # Windows Terminal 1.25.2733.0, from 2026-10-02, checked against this SHA-256 before it's
      # used.
      WT_ZIP: https://github.com/microsoft/terminal/releases/download/v1.25.2733.0/Microsoft.WindowsTerminal_1.25.2733.0_x64.zip
      WT_SHA256: bf3ef2012f6c44d8340a4c58125acc9498d19b580f9890dc043cdf831852e796
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # 2026-10-09
        with:
          toolchain: "1.99.0"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Install Windows Terminal's portable build
        if: matrix.os == 'windows-2022'
        shell: pwsh
        run: |
          $zip = Join-Path $env:RUNNER_TEMP 'wt.zip'
          Invoke-WebRequest -Uri $env:WT_ZIP -OutFile $zip -UserAgent 'termelon-ci'
          $hash = (Get-FileHash -Algorithm SHA256 $zip).Hash.ToLowerInvariant()
          if ($hash -ne $env:WT_SHA256) { throw "the Windows Terminal zip's SHA-256 is $hash" }
          $unpacked = Join-Path $env:RUNNER_TEMP 'wt'
          Expand-Archive -Path $zip -DestinationPath $unpacked
          $exe = Get-ChildItem $unpacked -Recurse -Filter WindowsTerminal.exe | Select-Object -First 1
          New-Item -ItemType File -Path (Join-Path (Split-Path $exe.FullName) '.portable') | Out-Null
          "HARNESS_WINDOWS_TERMINAL=$($exe.FullName)" >> $env:GITHUB_ENV
      - run: cargo build -p harness -p probe --locked
      - shell: bash
        run: target/debug/harness version windows-terminal
      - shell: bash
        run: target/debug/harness smoke windows-terminal
      - shell: bash
        run: target/debug/harness run windows-terminal --probe target/debug/probe.exe --out harness-out
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-terminal-${{ matrix.os }}
          path: harness-out
          if-no-files-found: ignore

  conhost:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'terminals')
    continue-on-error: true
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # 2026-10-09
        with:
          toolchain: "1.99.0"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # A new console opens in the default terminal, so this makes it conhost, by its id.
      - name: Open new consoles in conhost
        shell: pwsh
        run: |
          $conhost = '{B23D10C0-E52E-411E-9D5B-C09FDF709C7D}'
          New-Item -Path 'HKCU:\Console\%%Startup' -Force | Out-Null
          Set-ItemProperty -Path 'HKCU:\Console\%%Startup' -Name DelegationConsole -Value $conhost
          Set-ItemProperty -Path 'HKCU:\Console\%%Startup' -Name DelegationTerminal -Value $conhost
      - run: cargo build -p harness -p probe --locked
      - shell: bash
        run: target/debug/harness version conhost
      - shell: bash
        run: target/debug/harness smoke conhost
      - shell: bash
        run: target/debug/harness run conhost --probe target/debug/probe.exe --out harness-out
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: conhost-${{ matrix.os }}
          path: harness-out
          if-no-files-found: ignore

  linux-console:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'terminals')
    continue-on-error: true
    timeout-minutes: 20
    # The runner's kernel has virtual consoles, on a framebuffer of 1024 by 768. The driver runs
    # the probe on console 12 with openvt and reads it back from /dev/vcsu12, through sudo.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # 2026-10-09
        with:
          toolchain: "1.99.0"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo build -p harness -p probe --locked
      - run: target/debug/harness version linux
      - run: target/debug/harness smoke linux
      - run: target/debug/harness run linux --probe target/debug/probe --out harness-out
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-console-ubuntu-24.04
          path: harness-out
          if-no-files-found: ignore
