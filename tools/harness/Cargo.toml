[package]
name = "harness"
description = "Starts real terminals with the probe, drives them and reads back what they show"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
# Rebuilds each terminal's readback as a screen, and computes what the terminal should show for the
# bytes the probe wrote, so the two compare cell by cell.
termelon-vt.workspace = true
# Compares a cell's text in Unicode's composed form, since xterm and foot store a letter and its
# combining mark as the precomposed character where one exists.
unicode-normalization = "0.1.25"

[target.'cfg(windows)'.dependencies]
# The console, window and keyboard calls the Windows Terminal and conhost drivers make, in
# `src/windows.rs`.
windows-sys = { workspace = true, features = ["Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }

[lints]
workspace = true
