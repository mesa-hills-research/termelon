[package]
name = "bench"
description = "Workloads that compare the framework's output layer with ratatui and crossterm"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
# Widths of the cells in the frame model, the same crate and rules ratatui measures with.
unicode-width.workspace = true
# Splits text into grapheme clusters, one cell each, as ratatui does when it writes a string.
unicode-segmentation.workspace = true
# The baseline stack. Default features off and the two features Arko asks for, plus the one that
# opens the backend's writer, so the bytes it wrote can be read back. It changes no behaviour.
ratatui = { version = "0.30", default-features = false, features = ["crossterm", "underline-color", "unstable-backend-writer"] }
# For the synchronized update commands around a frame. ratatui builds its backend on this crate.
crossterm = { version = "0.29", default-features = false }
# Counts allocations. A counting allocator is `unsafe impl GlobalAlloc`, and unsafe code lives only in
# the files AGENTS.md lists, so the crate that holds it is a dependency.
stats_alloc = "0.1.10"
# The stack under test, its buffer and its encoder, which the feature makes reachable here.
termelon = { workspace = true, features = ["unstable-encoder"] }

[dev-dependencies]
# The widgets the tests draw beside ratatui's, to check that they draw the same.
termelon.workspace = true

[lints]
workspace = true
