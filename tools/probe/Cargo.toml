[package]
name = "probe"
description = "Runs inside a real terminal, measures it and draws test scenes, then writes a report"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
# The framework, whose terminal the probe opens and draws its scenes with.
tuiframe.workspace = true

[dev-dependencies]
# Checks that every scene is made of sequences the emulator knows, through `TestTerminal`.
tuiframe = { workspace = true, features = ["testing"] }

[lints]
workspace = true
