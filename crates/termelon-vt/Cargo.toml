[package]
name = "termelon-vt"
description = "A terminal emulator library for Rust, for testing what terminal programs write."
# Released on its own, when it changes.
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
documentation = "https://docs.rs/termelon-vt"
readme = "README.md"
keywords = ["terminal", "emulator", "vt100", "testing", "ansi"]
categories = ["command-line-interface", "development-tools::testing"]

[dependencies]
unicode-width.workspace = true
unicode-segmentation.workspace = true

[dev-dependencies]
proptest.workspace = true
# An independent emulator, so a test can replay the same bytes through both and compare the screens.
# Without its default features it builds no serialization support.
alacritty_terminal = { version = "0.26", default-features = false }

[lints]
workspace = true
