[package]
name = "termelon"
description = "A terminal UI framework in pure Rust, from raw mode and input to diffed, synchronized frames"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "../../README.md"
keywords = ["terminal", "tui", "ui", "console", "cli"]
categories = ["command-line-interface"]

[features]
# The `Stream` trait on `Events`, for programs that want it.
stream = ["dep:futures-core"]
# The encoder on its own, for the bench in tools/bench. It isn't part of the stable API.
unstable-encoder = []
# `testing::TestTerminal` and the golden helpers, for the tests of programs.
testing = ["dep:termelon-vt"]

[dependencies]
unicode-width.workspace = true
unicode-segmentation.workspace = true
futures-core = { workspace = true, optional = true }
# The emulator `TestTerminal` feeds its frames to, so a test sees what a terminal would show.
termelon-vt = { workspace = true, optional = true }

[target.'cfg(unix)'.dependencies]
rustix.workspace = true
signal-hook.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys.workspace = true

[dev-dependencies]
proptest.workspace = true
# The emulator, which reads what the library writes, encodes keys, mouse and pastes for the decoder,
# and plays a terminal on a pty's other side.
termelon-vt.workspace = true
# To check that `Events::next` works inside `tokio::select!`.
tokio = { workspace = true, features = ["rt", "macros", "time"] }

[target.'cfg(windows)'.dev-dependencies]
# A pseudoconsole (ConPTY) for the end-to-end tests on Windows, with the emulator on its terminal side.
portable-pty.workspace = true

[lints]
workspace = true
